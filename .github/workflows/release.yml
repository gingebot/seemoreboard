name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(sed -n 's/^app.versionName=//p' gradle.properties)"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Tag $RELEASE_TAG does not match $expected_tag from gradle.properties" >&2
            exit 1
          fi

          version_code="$(sed -n 's/^app.versionCode=//p' gradle.properties)"
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]]; then
            echo "app.versionCode must be a positive integer" >&2
            exit 1
          fi

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_file="$RUNNER_TEMP/seemoreboard-upload.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          test -s "$keystore_file"
          echo "ANDROID_KEYSTORE_FILE=$keystore_file" >> "$GITHUB_ENV"

      - name: Run release checks
        run: |
          ./gradlew testDebugUnitTest lint --no-daemon

      - name: Build signed AAB and APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Prepare release artifacts
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p release-artifacts
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/SeeMoreBoard-${version}-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/SeeMoreBoard-${version}-release.apk"
          (cd release-artifacts && sha256sum ./*.aab ./*.apk > SHA256SUMS)

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/seemoreboard-upload.keystore"